# Documentation and governance checks only.
#
# The repository now holds application code and an npm toolchain (Capability
# 1's `packages/cap1-core`/`cap1-daemon`, the Three-Surface POC, and their
# build/test scripts) alongside the still-pre-specification governance
# plane. This workflow covers only the governance plane: it installs a
# Python interpreter and one pinned test-only package (PyYAML, for the
# contract index's YAML-validity selftest) and runs the read-only checkers
# below, every one of which is otherwise stdlib-only. It does not install npm, build, lint, or run the application test
# suites — those gates live in the repo's other hosted workflow(s); adding
# them here would duplicate that coverage rather than add to it.
#
# The step list below is the hosted denominator. It is meant to match the
# battery `PROJECT-STATUS.md` publishes, so that "hosted CI is green" and
# "the battery is clean" are the same claim rather than two claims a reader
# conflates. When a check is added there, add it here.
name: governance-docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the launch-administration validator resolves the
          # commit a record names, and a depth-1 checkout would make every
          # such check silently unrunnable rather than red.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Repository-wide governance checks: links, retired tokens, candidate
      # banners, manifest digests, context budgets, authority homes.
      - name: check_governance
        run: python3 scripts/check_governance.py

      # Candidate contract package: clause continuity, citations, ceilings.
      - name: verify_final_prespec
        run: python3 .syzygy/governance/contracts/candidates/scripts/verify_final_prespec.py

      # Contract index drift: the generated index must match regeneration.
      - name: build_contract_index --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_contract_index.py --check

      # The index's own fixtures, including the YAML round trip that kills an
      # unquoted emit (syzygy-ejm3, syzygy-prn1). PyYAML is test-only and
      # pinned; without it the selftest fails rather than skipping.
      - name: install PyYAML (test-only, for build_contract_index --selftest)
        run: pip install 'PyYAML==6.0.3'

      - name: build_contract_index --selftest
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_contract_index.py --selftest

      # Dependency index drift: same guard, for the declared edges.
      - name: build_dependency_index --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_dependency_index.py --check

      # Every volatile measurement: fixture anchors and the generated report.
      - name: build_budget_report --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_budget_report.py --check

      # Wave manifest drift: the digests an owner act binds are generated,
      # and a stale manifest would offer an act over bytes that moved.
      - name: build_active_manifest --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_active_manifest.py --check

      # Task-router drift, and the router's own fixtures. The router is the
      # single generated answer to "what do I read for this task"; a drifted
      # router misroutes silently, which no other check here would notice.
      - name: build_task_router --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_task_router.py --check

      - name: build_task_router --selftest
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_task_router.py --selftest

      # Capability 1's five views against their one source. Owner charter
      # §10: the route and the first-spec sequence may not be independently
      # maintained enumerations, and a drift check nobody runs is a plan.
      - name: build_capability_1_views --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_capability_1_views.py --check

      - name: build_capability_1_views --selftest
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_capability_1_views.py --selftest

      # The Capability 1 specification's CC-IMPACT-1 dependency declaration
      # against its one source: the requirement warrant blocks in spec.md.
      # Stdlib-only, like every checker this job runs.
      - name: build_capability_1_spec_dependencies --check
        run: python3 scripts/build_capability_1_spec_dependencies.py --check

      - name: build_capability_1_spec_dependencies --selftest
        run: python3 scripts/build_capability_1_spec_dependencies.py --selftest

      # Generated evidence and dependency projections that guard performed
      # transaction history and the current Polaris/PWB specifications.
      - name: build_general_trusted_bootstrap_impact_ledger --check
        run: python3 scripts/build_general_trusted_bootstrap_impact_ledger.py --check

      - name: build_general_trusted_bootstrap_transaction --check
        run: python3 scripts/build_general_trusted_bootstrap_transaction.py --check

      - name: build_polaris_project_wide_contract_coverage --check
        run: python3 scripts/build_polaris_project_wide_contract_coverage.py --check

      - name: build_polaris_project_wide_spec_dependencies --check
        run: python3 scripts/build_polaris_project_wide_spec_dependencies.py --check

      - name: build_pwb_truth_policy_amendment --check
        run: python3 scripts/build_pwb_truth_policy_amendment.py --check

      - name: record_versioned_signoff --check pwb-missing-currency-disclosure-scenario
        run: python3 scripts/record_versioned_signoff.py --check pwb-missing-currency-disclosure-scenario --version 1.0

      - name: record_versioned_signoff --check pwb-dismissal-expiry-amendment
        run: python3 scripts/record_versioned_signoff.py --check pwb-dismissal-expiry-amendment --version 1.0

      - name: record_versioned_signoff --check pwb-container-shape-profile-amendment
        run: python3 scripts/record_versioned_signoff.py --check pwb-container-shape-profile-amendment --version 1.0

      - name: record_versioned_signoff --check pwb-item-depth-amendment
        run: python3 scripts/record_versioned_signoff.py --check pwb-item-depth-amendment --version 1.0

      - name: record_versioned_signoff --check pwb-readability-successor
        run: python3 scripts/record_versioned_signoff.py --check pwb-readability-successor --version 1.0

      - name: record_versioned_signoff --check pwb-tree-framing-amendment
        run: python3 scripts/record_versioned_signoff.py --check pwb-tree-framing-amendment --version 1.0

      - name: record_versioned_signoff --check polaris-dossier-local-agent-mode
        run: python3 scripts/record_versioned_signoff.py --check polaris-dossier-local-agent-mode --version 1.0

      - name: record_pwb_behavior_amendment_acts --check render-mode
        run: python3 scripts/record_pwb_behavior_amendment_acts.py --check render-mode 527be5ac3732619608355ae9658c92cee45341e831521bc526398481dd915785 --date 2026-10-02

      - name: record_pwb_behavior_amendment_acts --check machine-view
        run: python3 scripts/record_pwb_behavior_amendment_acts.py --check machine-view acabc7915e4461186b5878ce40cc0c62ed7cf91eadd7eead1cb179c80f672e72 --date 2026-10-02

      - name: record_versioned_signoff --selftest
        run: python3 scripts/record_versioned_signoff.py --selftest

      # The six version-signed PWB builders' fixtures and the helper that
      # reruns them (syzygy-tmkb, syzygy-6scq). After sign-off each builder's
      # --selftest runs its current bytes against the pre-adoption tree from
      # `git archive` of the last candidate commit, which is why this job
      # checks out with fetch-depth: 0; a shallow clone refuses with exit 1.
      - name: pwb_signed_selftest --selftest
        run: python3 scripts/pwb_signed_selftest.py --selftest

      - name: build_pwb_missing_currency_disclosure_scenario --selftest
        run: python3 scripts/build_pwb_missing_currency_disclosure_scenario.py --selftest

      - name: build_pwb_dismissal_expiry_amendment --selftest
        run: python3 scripts/build_pwb_dismissal_expiry_amendment.py --selftest

      - name: build_pwb_container_shape_profile_amendment --selftest
        run: python3 scripts/build_pwb_container_shape_profile_amendment.py --selftest

      - name: build_pwb_item_depth_amendment --selftest
        run: python3 scripts/build_pwb_item_depth_amendment.py --selftest

      - name: build_pwb_readability_successor --selftest
        run: python3 scripts/build_pwb_readability_successor.py --selftest

      - name: build_pwb_tree_framing_amendment --selftest
        run: python3 scripts/build_pwb_tree_framing_amendment.py --selftest

      # The Polaris dossier local-agent builder (#353, #364): --check passes
      # while the change is absent, unapplied or applied; its fixtures run
      # before and after the package's version-tagged sign-off.
      - name: build_polaris_dossier_local_agent_mode --check
        run: python3 scripts/build_polaris_dossier_local_agent_mode.py --check

      - name: build_polaris_dossier_local_agent_mode --selftest
        run: python3 scripts/build_polaris_dossier_local_agent_mode.py --selftest

      - name: record_pwb_behavior_amendment_acts --check opening-band
        run: python3 scripts/record_pwb_behavior_amendment_acts.py --check opening-band 7f80cb05f644dd1e4f49e7b212d6972ee4754e40682450e59a6c3245546d5c46 --date 2026-10-01

      - name: build_pwb_registry_currency_briefing_amendment --check
        run: python3 scripts/build_pwb_registry_currency_briefing_amendment.py --check

      - name: build_pwb_registry_currency_briefing_amendment --selftest
        run: python3 scripts/build_pwb_registry_currency_briefing_amendment.py --selftest

      - name: record_pwb_registry_currency_amendment --check
        run: python3 scripts/record_pwb_registry_currency_amendment.py --check 2356b9ed3235b3dff79caeb352803a30c446b7365a2a7ea74df302b9fa51386a --date 2026-09-30

      - name: record_pwb_registry_currency_amendment --selftest
        run: python3 scripts/record_pwb_registry_currency_amendment.py --selftest

      - name: build_pwb_behavior_contract_repin --check
        run: python3 scripts/build_pwb_behavior_contract_repin.py --check

      - name: build_pwb_behavior_contract_repin --selftest
        run: python3 scripts/build_pwb_behavior_contract_repin.py --selftest

      - name: record_pwb_behavior_contract_repin_acts --check policy
        run: python3 scripts/record_pwb_behavior_contract_repin_acts.py --check policy 66cd41ee626efb11d666d19c0cd42c6d001ec4482837b71475c42f661f1d936c --date 2026-10-02

      - name: record_pwb_behavior_contract_repin_acts --check registry
        run: python3 scripts/record_pwb_behavior_contract_repin_acts.py --check registry ad9cd6769bffbb1a3ef94625c73226dec133fb7c9f1e0bc40186b09b15e165fa --date 2026-10-02

      - name: record_pwb_behavior_contract_repin_acts --selftest
        run: python3 scripts/record_pwb_behavior_contract_repin_acts.py --selftest

      - name: check_polaris_response_ceiling_reading --check
        run: python3 scripts/check_polaris_response_ceiling_reading.py --check

      - name: check_polaris_response_ceiling_reading --selftest
        run: python3 scripts/check_polaris_response_ceiling_reading.py --selftest

      # The contract readability restyle: the candidate package regenerates
      # exactly, and its act recorder reports "not performed" (exit 0) until
      # the owner's act is recorded, then verifies both records.
      - name: build_contract_readability_restyle --check
        run: python3 scripts/build_contract_readability_restyle.py --check

      - name: build_contract_readability_restyle --selftest
        run: python3 scripts/build_contract_readability_restyle.py --selftest

      - name: record_contract_readability_restyle --check
        run: python3 scripts/record_contract_readability_restyle.py --check

      - name: record_contract_readability_restyle --selftest
        run: python3 scripts/record_contract_readability_restyle.py --selftest

      # The specification-policy readability restyle: the same shape, over
      # CC-SPEC and CC-IMPACT.
      - name: build_spec_policy_readability_restyle --check
        run: python3 scripts/build_spec_policy_readability_restyle.py --check

      - name: build_spec_policy_readability_restyle --selftest
        run: python3 scripts/build_spec_policy_readability_restyle.py --selftest

      - name: record_spec_policy_readability_restyle --check
        run: python3 scripts/record_spec_policy_readability_restyle.py --check

      - name: record_spec_policy_readability_restyle --selftest
        run: python3 scripts/record_spec_policy_readability_restyle.py --selftest

      - name: build_three_surface_poc_readability_successor --check
        run: python3 scripts/build_three_surface_poc_readability_successor.py --check

      - name: build_three_surface_poc_readability_successor --selftest
        run: python3 scripts/build_three_surface_poc_readability_successor.py --selftest

      - name: record_three_surface_poc_readability_successor --check
        run: python3 scripts/record_three_surface_poc_readability_successor.py --check

      - name: record_three_surface_poc_readability_successor --selftest
        run: python3 scripts/record_three_surface_poc_readability_successor.py --selftest

      - name: readability_successor --all --check
        run: python3 scripts/readability_successor.py --all --check

      - name: readability_successor --selftest
        run: python3 scripts/readability_successor.py --selftest

      - name: build_polaris_dependency_unions --check
        run: python3 scripts/build_polaris_dependency_unions.py --check

      - name: build_polaris_dependency_unions --selftest
        run: python3 scripts/build_polaris_dependency_unions.py --selftest

      # Reconciled specification composition (syzygy-73e.5.6): the five
      # readability outcomes are terminal and still bind the bytes on disk;
      # requirement/scenario populations agree by two methods.
      - name: check_spec_reconciliation --check
        run: python3 scripts/check_spec_reconciliation.py --check

      - name: check_spec_reconciliation --selftest
        run: python3 scripts/check_spec_reconciliation.py --selftest

      - name: build_three_surface_poc_spec_dependencies --check
        run: python3 scripts/build_three_surface_poc_spec_dependencies.py --check

      # The directive register: every governing identifier and its definition
      # site, across all five trees. --check fails when a clause moves, is
      # renumbered against CC-REV-7, or gains a definition the page has not
      # seen; --selftest holds the predicate's fixtures, including the
      # leading-possessive-citation line that is not a definition.
      - name: build_directive_register --check
        run: python3 scripts/build_directive_register.py --check

      - name: build_directive_register --selftest
        run: python3 scripts/build_directive_register.py --selftest

      # A quotation written beside a path:line locator must have been said by
      # that file in some committed revision (RD-6 F-2's class, syzygy-0wf).
      # It reads history, which is why the checkout above is full depth.
      - name: check_quotations
        run: python3 scripts/check_quotations.py

      - name: check_quotations --selftest
        run: python3 scripts/check_quotations.py --selftest

      # The checkers' own fixtures. A hosted run that exercises the checks
      # but never the checks' checks reports a denominator it does not have.
      # Every one is stdlib-only, which is why they can run here at all —
      # the hosted job installs no packages, so a checker that imported one
      # would be unrunnable here and its coverage would be local-only.
      - name: check_governance --selftest
        run: python3 scripts/check_governance.py --selftest

      - name: understanding adoption exact-digest chain
        run: python3 scripts/record_polaris_understanding_adoption.py --check

      - name: understanding adoption chain selftests
        run: python3 scripts/record_polaris_understanding_adoption.py --selftest

      - name: launch_gate_results --selftest        # historical Markdown records
        run: python3 scripts/launch_gate_results.py --selftest

      - name: validate_launch_administration --selftest
        run: python3 scripts/validate_launch_administration.py --selftest

      - name: render_launch_administration --selftest
        run: python3 scripts/render_launch_administration.py --selftest

      # The worked v2.0 record: it validates, and its report regenerates to
      # the committed bytes. A generated file that drifts from its source is
      # the one failure mode a generator cannot report about itself.
      - name: dry-run administration record validates
        run: python3 scripts/validate_launch_administration.py .syzygy/governance/contracts/candidates/round-2026-08f/fixtures/DRY-RUN-ADMINISTRATION.json

      - name: dry-run administration report is regenerable
        run: python3 scripts/render_launch_administration.py .syzygy/governance/contracts/candidates/round-2026-08f/fixtures/DRY-RUN-ADMINISTRATION.json --check
