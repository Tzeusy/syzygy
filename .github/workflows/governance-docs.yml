# Documentation and governance checks only.
#
# This repository is pre-specification: there is no application code, no
# toolchain manifest, and no product tooling to run. This workflow therefore
# installs nothing beyond a Python interpreter and runs the three read-only
# checkers that already exist. Adding a linter, a build, or a dependency step
# here would be a stack choice, which requires an accepted contract.
name: governance-docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the launch-administration validator resolves the
          # commit a record names, and a depth-1 checkout would make every
          # such check silently unrunnable rather than red.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Repository-wide governance checks: links, retired tokens, candidate
      # banners, manifest digests, context budgets, authority homes.
      - name: check_governance
        run: python3 scripts/check_governance.py

      # Candidate contract package: clause continuity, citations, ceilings.
      - name: verify_final_prespec
        run: python3 .syzygy/governance/contracts/candidates/scripts/verify_final_prespec.py

      # Contract index drift: the generated index must match regeneration.
      - name: build_contract_index --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_contract_index.py --check

      # Dependency index drift: same guard, for the declared edges.
      - name: build_dependency_index --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_dependency_index.py --check

      # Every volatile measurement: fixture anchors and the generated report.
      - name: build_budget_report --check
        run: python3 .syzygy/governance/contracts/candidates/scripts/build_budget_report.py --check

      # The checkers' own fixtures. A hosted run that exercises the checks
      # but never the checks' checks reports a denominator it does not have.
      # All three are stdlib-only, which is why they can run here at all.
      - name: check_governance --selftest
        run: python3 scripts/check_governance.py --selftest

      - name: launch_gate_results --selftest        # historical Markdown records
        run: python3 scripts/launch_gate_results.py --selftest

      - name: validate_launch_administration --selftest
        run: python3 scripts/validate_launch_administration.py --selftest

      - name: render_launch_administration --selftest
        run: python3 scripts/render_launch_administration.py --selftest

      # The worked v2.0 record: it validates, and its report regenerates to
      # the committed bytes. A generated file that drifts from its source is
      # the one failure mode a generator cannot report about itself.
      - name: dry-run administration record validates
        run: python3 scripts/validate_launch_administration.py .syzygy/governance/contracts/candidates/round-2026-08f/fixtures/DRY-RUN-ADMINISTRATION.json

      - name: dry-run administration report is regenerable
        run: python3 scripts/render_launch_administration.py .syzygy/governance/contracts/candidates/round-2026-08f/fixtures/DRY-RUN-ADMINISTRATION.json --check
