# Scheduled mutation gate for polaris-generation-core (bead syzygy-u05.11
# slice 2).
#
# This workflow is read-only: it installs, builds, and runs the
# `poc:generation-mutation-run` mutation gate over
# `packages/polaris-generation-core/src/{canonical-json,parse-json,pipeline,
# provider-draft}.ts`, which mutates those sources in a scratch working
# copy, runs the independent tests, and restores the originals in a
# `finally` (digest-verified). It uploads the evidence JSON as a run
# artifact for inspection; it never commits, pushes, or writes back to the
# repository. A survived mutant or a restore failure fails the job.
#
# It is deliberately separate from node-ci.yml and governance-docs.yml: a
# full mutation sweep is far slower than either hosted battery, so it runs
# on its own schedule rather than on every push/PR, and its failure mode
# (a surviving mutant) is a distinct signal from a red test or a stale
# generated file.
name: generation-mutation-gate

on:
  schedule:
    # 05:00 UTC daily. Cron, not a fixed clock a reader can rely on exactly;
    # treat "roughly once a day" as the guarantee.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install (npm ci)
        run: npm ci

      # The runner mutates packages/polaris-generation-core/src in place per
      # mutant and restores the original bytes in a `finally`, digest
      # verified; it never leaves a mutation behind and never pushes.
      - name: polaris-generation-core mutation gate
        run: npm run poc:generation-mutation-run

      # A clean tree after the gate is part of the guardrail this workflow
      # exists to uphold: the runner's own restoration must have worked.
      - name: confirm sources restored
        run: |
          git status --porcelain -- packages/polaris-generation-core
          test -z "$(git status --porcelain -- packages/polaris-generation-core)"

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polaris-generation-core-mutation-evidence
          path: docs/evidence/polaris-generation-core-mutation-run-*.json
          if-no-files-found: warn
