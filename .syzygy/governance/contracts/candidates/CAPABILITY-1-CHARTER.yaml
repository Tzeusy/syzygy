# authoring, and the owner decided so explicitly. Their queue rows stay
# open; nothing here disposes them.
blocking_decisions: []

# Open upstream, at a LATER gate — named so a reader is not surprised by
# them, not because authoring consumes them.
#
# P-35 ruled 2026-08-16 (full operating-constraints table recorded) and
# removed from this list — `../../decisions/DECISION-HISTORY.md`
# ("Resolved on 2026-08-16"), `../../decisions/PROJECT-OPERATING-CONSTRAINTS-DECISION.md`.
#
# P-34 ruled 2026-08-16 (arm a — launch-gate v2.4 approved as process
# policy, two residuals disclosed, F5 not promoted) and removed from this
# list — `../../decisions/LAUNCH-GATE-AUTHORITY-DECISION.md`. The later
# gate it named (the formal administration) is thereby runnable, not run.
downstream_decisions: []

non_goals:
  - "Any composite or rolled-up project score, badge, or single health number"
  - "Certification of any kind — registration is never certification"
  - "Writing to a governed repository: the discoverability link is proposed, never written"
  - "Mission evaluation, which renders `not evaluated / deferred / Unknown` until the C/D semantics exist"
  - "Deterministic context-packet generation, which is Capability 2"
  - "Any choice of language, framework, database, graph store, rendering engine, or deployment target"

deferred_semantics:
  - id: "facet vocabulary"
    note: "The facet names themselves are drafted in no accepted module. P-37 ruled 2026-08-16 (SDR-36): the Capability 1 specification owns them (site a2), not a Wave A amendment. The vocabulary still needs authoring into this specification when it is written — the ruling names the site, not the text."
  - id: "Mission-ready facet"
    note: "Renders `not evaluated / deferred / Unknown` while Waves D1/D2 are deferred. The facet exists; its semantics do not."
  - id: "merged-but-unreconciled reason"
    note: "P-31 ruled 2026-08-16 (SDR-34): the drafted RFC2-19(a) exemption is ratified as written — the flagship V0 rendering is bound to no thirteenth reason; the condition is disclosed as a fact of the render."

# Assertions the charter makes about itself, each one the builder checks.
# A charter that claims a property no check tests is a wish.
self_checks:
  - "every governing_clauses entry resolves to exactly one module in 05-CONTRACT-INDEX.yaml"
  - "every resolved module is named by the Wave A or Wave B manifest"
  - "no resolved module is named by a deferred-wave manifest"
  - "every owner_decisions and blocking_decisions entry is an OPEN row of the pending-decisions queue"
  - "no decision appears in both blocking_decisions and downstream_decisions"
  - "no clause appears in two behaviour rows"
