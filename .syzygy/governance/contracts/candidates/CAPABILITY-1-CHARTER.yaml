# CAPABILITY-1-CHARTER — candidate planning metadata, not product authority.
#
# *** SUPERSEDED FOR REQUIRED BEHAVIOUR, 2026-08-20 (recorded 2026-08-21).
# *** The owner adopted the Capability 1 specification
# *** (`openspec/changes/project-registration-and-honest-shape-visibility/`)
# *** at exact digests — the act record is
# *** `../../decisions/CAPABILITY-1-SPECIFICATION-ADOPTION-ACT.md`. Per this
# *** charter's own terms below, the accepted specification now supersedes
# *** it for required behaviour and this file is history: kept as the record
# *** of how the capability was scoped, generating its views unchanged,
# *** answering no behavioral question the adopted specification owns.
#
# WHAT THIS IS. One machine-readable source for everything the repository
# says about Capability 1's shape. Five views are generated from it and none
# of them is edited by hand:
#
#     the Capability 1 task-router route   (build_task_router.py reads this)
#     the first-specification sequence's behaviour rows
#     the E3 trace-table skeleton
#     the initial clause-coverage population
#     the blocking-decision list
#
# Regenerate and check drift with scripts/build_capability_1_views.py.
#
# WHAT THIS IS NOT. Not a specification, not authority, and not a decision.
# It binds nothing, adopts nothing, and creates no `openspec/` content.
# Every clause it names is, as of 2026-08-17, an ACCEPTED clause of Wave A
# or Wave B (the acts of that date; modules installed at `contracts/rfcs/`)
# — the acceptance is the module's, and this charter still cites rather
# than owns it. Once Capability 1 is accepted in OpenSpec, the accepted
# specification supersedes this charter for required behaviour and this
# file becomes history.
#
# NO AUTHORITY HOMES ARE WRITTEN HERE, DELIBERATELY. The charter names
# clause IDs only; the builder resolves each to its owning module from the
# generated 05-CONTRACT-INDEX.yaml. A clause that does not exist, or that a
# hand-written path would have mis-homed, cannot survive generation.

capability_id: CAP-1
title: "Project registration and honest shape visibility"

argument: "A project can be registered and its shape read honestly — every facet answered on its own, every Unknown carrying its reason and its owning authority, and the same facts reaching a human and a machine — without any claim the evidence does not support."

# The waves whose clauses this capability may cite. A clause homed in a
# module outside these waves is a generation error, which is how "no C/D
# dependency" is enforced rather than asserted.
required_waves: [A, B]
deferred_waves: [C1, C2, D1, D2]

# Doctrine that governs the capability as a whole rather than one row.
doctrine: [VIS-4]

# THREE CLAUSES ADDED 2026-08-13 by the outline exercise (RD-60), which was
# run against charter sha256 15e92acbd5a62c3f28ff507abc59fd07fb7657ceb19978c3
# c4921fede64ad107 — the bytes BEFORE this addition. Each is a reliance, not a
# decoration (verification rule 5), and each was verified defined and homed in
# a Wave A module before being added:
#
#   RFC6-22  cited from inside RFC6-17's own body — the aggregate must
#            disclose "the full RFC6-22 equivalence tuple", so an author
#            cannot satisfy RFC6-17 without it
#   RFC1-27  cited from inside RFC7-40's own body — the link is proposed as
#            "a Proposal, RFC1-27", and row 1.6's obligation is that Proposal
#   RFC3-3   direct-write containment, the contract-level statement of what
#            row 1.6's "never write it" means; VIS-5 is the doctrine half
#
# The exercise found them by trying to write requirements and running out of
# authority. That is what the exercise is for.
#
# A FOURTH CLAUSE, RFC6-23, was added the same day by the session dispositioning
# that exercise — NOT by the exercise, which cited RFC6-23 only as the
# consequence of a falsifier. The disposition asked the reliance question
# (verification rule 5) and answered it differently: RFC6-18 gives row 1.5 "one
# fact set" and RFC6-22 gives the comparison tuple, but only RFC6-23 enumerates
# the twelve things two equivalent renderings may not disagree about and makes
# the disagreement release-blocking. That enumeration IS the parity oracle's
# domain, so an author cannot write row 1.5's acceptance without it. Recorded
# as this session's reading, open to the owner disagreeing with the reasoning
# rather than only the conclusion.

behavior_rows:

  - id: "1.1"
    statement: "Parse and validate the project declaration; an invalid declaration is a named failure, never partial registration"
    governing_clauses: [RFC1-1, RFC3-1, RFC3-4, RFC3-5, RFC3-9]
    doctrine: [VIS-2]
    owner_decisions: []
    policy_requirements: []
    topology: []

  - id: "1.2"
    statement: "Record consent and repository coverage; the boundary renders as a fact, not silence"
    governing_clauses: [RFC1-3, RFC1-4, RFC3-6, RFC3-7, "RFC3-16(a)", RFC5-3, RFC6-26]
    doctrine: [VIS-5]
    owner_decisions: []
    policy_requirements: []
    topology: []

  - id: "1.3"
    statement: "Serve the fixed human entry at the declared entry path"
    governing_clauses: [RFC7-39]
    doctrine: []
    # P-38 ruled 2026-08-16 (option a, as drafted) — no longer an open-queue
    # row, so it is removed from this list per the charter's own self-check
    # rather than left to fail generation. Ruling record:
    # `../../decisions/PENDING-OWNER-DECISIONS.md` (Resolved on 2026-08-16),
    # `../../decisions/HUMAN-ENTRY-DECISION.md`.
    owner_decisions: []
    policy_requirements: []
    topology: []

  - id: "1.4"
    statement: "Answer the shape facets independently — no rollup, no composite badge; uncomputed reconciliation renders Unknown"
    governing_clauses: [RFC2-24, RFC6-17, RFC6-18, RFC6-19, RFC6-22, RFC8-18, RFC8-19]
    doctrine: [VIS-2]
    # P-31, P-36, P-37 all ruled 2026-08-16 — see SDR-34/35/36 in
    # `../../decisions/SURFACE-DECISION-RECORD.md` and the "Resolved on
    # 2026-08-16" section of `../../decisions/PENDING-OWNER-DECISIONS.md`.
    owner_decisions: []
    policy_requirements: []
    topology: []

  - id: "1.5"
    statement: "Expose the owning authority and the Unknown reason for every answer, identically to human and machine"
    governing_clauses: [RFC3-16, RFC6-13, RFC6-14, RFC6-15, RFC6-23, RFC7-33]
    doctrine: [VIS-2]
    # P-36 ruled 2026-08-16 — SDR-35, `../../decisions/SURFACE-DECISION-RECORD.md`.
    owner_decisions: []
    policy_requirements: []
    topology: []

  - id: "1.6"
    statement: "Render per-repository discoverability in the closed four-value domain; propose the link, never write it"
    governing_clauses: [RFC1-27, RFC3-3, RFC7-40]
    doctrine: [VIS-5]
    # P-38 ruled 2026-08-16 — see row 1.3's note above.
    owner_decisions: []
    policy_requirements: []
    topology: []

# Decisions and acts that block AUTHORING this capability, over and above
# the per-row ones above. Each is checked at generation against the queue's
# own open table: a resolved or executed row is refused, and so is a row the
# queue does not carry.
#
# P-33, P-39, P-40 ruled 2026-08-16 and removed from this list per the
# charter's own self-check ("every ... blocking_decisions entry is an OPEN
# row of the pending-decisions queue"). None of the three rulings performs
# the Wave A/B acts or authors OpenSpec — see
# `../../decisions/PENDING-OWNER-DECISIONS.md` ("Resolved on 2026-08-16")
# for what each ruling was and what remains open.
#
# P-41 and P-42 EXECUTED 2026-08-17 (craft acts 6 and 7, one sitting) and
# removed per the same self-check — record:
# `../../decisions/ACCEPTANCE-ACT-RECORD.md`. P-22 and P-28 resolved the
# same day by §7 ratification at the Wave B and Wave A acts and their rows
