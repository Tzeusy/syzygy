# ---------------------------------------------------------------- retired
#
# A retired phrase satisfies nothing. Writing it as though it were live is the
# P-6 defect class, and it has now recurred once per retirement.
#
# `retired_at` is the date the retirement took effect; `retired_at_event`
# names the delivery that carried it, so the date can be checked against the
# repository's own history rather than trusted.

retired_phrases:
  - label: "ACCEPT FOUNDATIONAL RFCS"
    retired_at: "2026-08-03"
    retired_at_event: "rev10 delivery"
    replaced_by: "ACCEPT COMPACTED FOUNDATIONAL RFCS"
    replacement_status: "itself since retired — see the entry below"
    why: >-
      retired unconditionally, because supersession of an authority must not
      be conditional on exercising the authority that supersedes it, and the
      rev9 phrase carries no digest argument and so cannot self-identify which
      corpus it would bind.
  - label: "ACCEPT COMPACTED FOUNDATIONAL RFCS"
    retired_at: "2026-08-09"
    retired_at_event: "round-2026-08d delivery, commit 771965c"
    replaced_by: "ACCEPT FOUNDATIONAL WAVE <A|B|C1|C2|D1|D2>"
    replacement_status: "current — six wave acts, listed above"
    why: >-
      the six wave acts supersede the single all-in-one act, and an offer
      superseded must not remain performable beside its successor.

# ------------------------------------------- historical-quotation convention
#
# A retired phrase may be *named* — a retirement notice must be able to say
# what it retires, a reviewer's sweep must be able to state what it swept for,
# and the frozen record must be able to preserve what was offered. What
# distinguishes a lawful quotation from a live offer is a **marker**: a word
# on the quotation's own line, or within two lines of it, that says the phrase
# is no longer performable. This is the same shape CG-7d requires of a
# historical digest quotation and CG-22 requires of a retired field name.
#
# Three ways to be lawful, and no fourth:
#   1. carry a marker at the quotation, or
#   2. sit in a file whose **first twelve lines** carry a SUPERSEDED /
#      Historical / RETIRED banner — the whole artifact is then marked, and
#      per-line markers would be noise. This is CG-15's `superseded_banner`
#      rule, applied to phrases; a banner in the body does not count, because
#      a reader must meet it before the quotation, or
#   3. sit inside a path allowlisted in `check_governance.py`
#      (`RETIRED_PHRASE_ALLOW`), each entry with its printed reason — the
#      shape used for whole files whose job is to preserve what was offered
#      and which carry no banner of their own (AGENTS.md, this checker).
#
# `currency_signals` are the opposite: tokens that present a phrase as the
# gate to write *now*. A retired phrase beside one of these is the worse
# class, and CG-2a reports it separately.

historical_marker_convention:
  markers:
    - "retired"
    - "retirement"
    - "stale"
    - "superseded"
    - "supersedes"
    - "satisfies nothing"
    - "satisfied nothing"
    - "historical"
    - "no longer"
    - "not performable"
    - "prior"
    - "previous"
    - "former"
    - "pre-amendment"
    - "was the"
    - "used to"
  marker_window_lines: 2
  currency_signals:
    - "exact phrase"
    - "the phrase is"
    - "write the phrase"
    - "the owner writes"
    - "perform the act"
    - "the gate is"
    - "acceptance gate:"
    - "in force"
    - "current phrase"
    - "to accept"
