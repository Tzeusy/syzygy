# ACCEPTANCE-PHRASE-REGISTRY — a record, never authority.
#
# This file records which acceptance phrases are current, which are retired,
# and how a document may lawfully quote a retired one. It **decides nothing**.
# The gates themselves — the exact phrases, the exact digest arguments, and
# the ceremony — live in
# `FINAL-FOUNDATIONAL-CONTRACT-ACCEPTANCE-RECORD.md`, which is the acceptance
# authority; where this file and that record disagree, the record wins and
# this file is the thing that is wrong. Nothing here adopts anything (VIS-4),
# and no act may be performed from this file.
#
# Why it exists. Two retirements have now happened (rev9's phrase at rev10,
# rev10's phrase at round-2026-08d), and each time the checker learned about
# the new retirement by someone editing a Python constant. The launch-gate
# administration of 2026-08-09 found the consequence: `check_governance.py`
# CG-2 named only the rev9 phrase, so the *successor* phrase was live in five
# artifacts and invisible to the battery (gate findings C1/E6/F3). The
# population a check sweeps for must be a declared list, not a literal in the
# check. **A future retirement is one entry added below — never a new check.**
#
# Every digest here is deliberately absent. Digests are computed from their
# subject artifacts at check time (verification rule 3: a derived value quoted
# outside its owning artifact goes stale silently). This file names *subjects*,
# never their hashes.
#
# Consumed by `scripts/check_governance.py`: CG-2a (retired-phrase confinement),
# CG-2e (wrapped current-phrase arguments), CG-7d/CG-7e (act-argument copies).

version: 1
as_of: "2026-09-05"
authority: "FINAL-FOUNDATIONAL-CONTRACT-ACCEPTANCE-RECORD.md"
status: "record — candidate material, binds nothing"

# ---------------------------------------------------------------- current
#
# `subject` is repo-relative and its sha256 is the act's argument. `argument:
# sha256` means the phrase is written with a 64-hex argument; `argument: reason`
# means the phrase takes free prose and has no checkable digest.
#
# `label` is the exact token CG-7d/CG-7e match on, and is what the check
# prints. It is the phrase minus its argument.

