# Governance substrate lock
#
# WHAT THIS IS. Syzygy's owner-approved policies and its agent operating
# procedure adopt external material *by reference* — most consequentially,
# craft-and-care adopts the `th-engineering` bar (see
# `craft-and-care/README.md`, "Adoption by reference"). Until this file
# existed, those references named a founder-machine path
# (`~/.claude/skills/th-engineering/...`), which no clone can resolve. This
# file makes every such reference resolvable from a clean clone by naming the
# public repository, the exact commit, the exact paths, and content digests a
# reader can recompute.
#
# WHAT THIS IS NOT. This file is a **record, not authority**. It adopts
# nothing, changes no policy, and cannot widen what the owner approved. Where
# it disagrees with an owner-approved policy, the policy wins and this file is
# stale. It is checked by `scripts/check_governance.py` (CG-19).
#
# DIGEST CONVENTION. Two independent kinds appear, both recomputable:
#   git_tree   — the git tree object id of a directory at the named commit.
#                Verify: `git rev-parse <commit>:<path>`
#   sha256     — sha256 of the exact file bytes at the named commit.
#                Verify: `git cat-file blob <commit>:<path> | sha256sum`
# Recomputed 2026-08-05 in the same session that wrote them.

version: 1
as_of: "2026-08-05"
recomputed_in_session: true

