  commands:
    - "git clone https://github.com/Tzeusy/ai-bootstrap /tmp/aib"
    - "cd /tmp/aib && git rev-parse f4cf1c7d7fdcacf61e1325e611a368403f372d74:skills/personal/th-engineering"
    - "cd /tmp/aib && git cat-file blob f4cf1c7d7fdcacf61e1325e611a368403f372d74:skills/personal/th-engineering/subskills/test-rigor/SKILL.md | sha256sum"
    - "sha256sum .claude/skills/th-engineering/subskills/test-rigor/SKILL.md .codex/skills/th-engineering/subskills/test-rigor/SKILL.md  # confirm the vendored copy matches the upstream blob"
  expected: >-
    The tree id and sha256 values recorded above, and the two vendored-copy
    sha256sums equal to the upstream blob's. Any disagreement means this lock
    (or the vendored copy) is stale — report it, do not edit either to match
    the other without checking which one moved.
  report: ".syzygy/governance/contracts/candidates/round-2026-08b/SUBSTRATE-REPRODUCIBILITY-REPORT.md (superseded 2026-08-06 by this re-pin — a fresh clone report is still owed, see PENDING-OWNER-DECISIONS.md)"
