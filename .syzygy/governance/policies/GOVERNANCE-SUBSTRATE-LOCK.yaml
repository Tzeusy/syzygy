# ---------------------------------------------------------------------------
# Deliberately NOT locked
# ---------------------------------------------------------------------------
not_locked:
  - name: "~/.dotfiles (github.com/Tzeusy/.dotfiles)"
    reason: >-
      PRIVATE repository, and not needed. It is only the checkout harness that
      places ai-bootstrap on the founder machine; every path this repository
      actually references lives inside the public `ai-bootstrap` submodule,
      which is locked above. A clone-holder never needs .dotfiles.
  - name: "the founder machine's ~/.claude/skills/** symlinks"
    reason: >-
      Machine-local installation detail. `~/.claude/skills/th-engineering`
      resolves to `~/.dotfiles/ai-bootstrap/skills/personal/th-engineering`;
      the content is what the lock names, and the symlink is not. As of
      2026-08-06 this repository no longer depends on that symlink at all —
      see `th_engineering.vendored` for the in-tree copy.

